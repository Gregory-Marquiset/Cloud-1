- name: Create DuckDNS update script
  ansible.builtin.template:
    src: duckdns-update.sh.j2
    dest: /usr/local/bin/duckdns-update.sh
    mode: '0700'
- name: Create DuckDNS service file
  ansible.builtin.template:
    src: duckdns.service.j2
    dest: /etc/systemd/system/duckdns.service
    mode: '0644'
- name: Create DuckDNS timer file
  ansible.builtin.template:
    src: duckdns.timer.j2
    dest: /etc/systemd/system/duckdns.timer
    mode: '0644'
- name: Enable and start DuckDNS timer
  ansible.builtin.systemd_service:
    name: duckdns.timer
    state: started
    enabled: true
    daemon_reload: true
