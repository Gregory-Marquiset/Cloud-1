- name: Mettre a jour le cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
- name: Installer les paquets de base
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, ufw]
    state: present
- name: Refuser tout le trafic entrant
  community.general.ufw:
    direction: incoming
    policy: deny
- name: Autoriser tout le trafic sortant
  community.general.ufw:
    direction: outgoing
    policy: allow
- name: Autoriser les connexions SSH, HTTP et HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 22
    - 80
    - 443
- name: Activer le pare-feu
  community.general.ufw:
    state: enabled
